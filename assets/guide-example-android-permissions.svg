<svg xmlns="http://www.w3.org/2000/svg" width="360" height="224" viewBox="0 0 360 224">
  <title>Android 앱 정보에서 권한 메뉴 찾기</title>
  <rect width="360" height="224" fill="#edf2e4"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#143f36">
    <text x="20" y="32" font-size="20" font-weight="700">Android 화면 예시</text>
    <text x="20" y="64" font-size="22">설정 → 앱 → 예시 메모</text>
    <rect x="18" y="82" width="324" height="124" rx="12" fill="#ffffff" stroke="#96ab9e"/>
    <text x="32" y="118" font-size="23" font-weight="700">앱 정보</text>
    <rect x="30" y="133" width="300" height="55" rx="8" fill="#d9eea5" stroke="#467146" stroke-width="2"/>
    <text x="44" y="168" font-size="28" font-weight="700">권한</text>
    <text x="191" y="167" font-size="22" font-weight="700">여기를 탭</text>
    <path d="m300 152 8 8-8 8" fill="none" stroke="#124c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
